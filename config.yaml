# ───────── 매일 06:00 블로거 관심 기사 ─────────
blogs:
  ids: ["dhgusdnd44", "travelingcompanion", "mech05", "ironbed2", "rnjs1016k"]
  max_articles: 15
  # 블로거들의 글을 읽고 정리한 관심사와 '앞으로 다룰 주제' 검색어.
