# 관심기업 데이터 트래커 설정
# 이 파일만 고치면 키워드·주기 외 대부분을 바꿀 수 있습니다.

briacell:
  # 브리아셀 IR 뉴스 위젯 (investors.briacell.com/news-events 가 실제로 불러오는 피드)
  feed_url: "https://feeds.issuerdirect.com/news.html?symbol=BCTX&per_page=50&news_template=plain"
  # 백업: 구글 뉴스 RSS
  google_news_query: "BriaCell"
  # 탑라인 발표로 볼 제목 패턴 (대소문자 무시)
  topline_patterns:
    - "topline"
    - "top-line"
    - "interim (analysis|data|results)"
    - "primary endpoint"
    - "overall survival"
    - "phase 3 .*\\b(results|met|meets|achieved|achieves|statistically)\\b"
  # 위 패턴에 걸려도, 아래 단어가 있으면 '예고' 기사로 보고 일반 알림으로만 보냄
  preview_patterns:
    - "on track"
    - "expected"
    - "anticipat"
    - "enrollment"
    - "enrolment"
  # 탑라인은 아니지만 3상 관련이라 알림으로 받을 제목 패턴 (그 외 보도자료는 보내지 않음)
  phase3_patterns:
    - "phase 3"
    - "phase iii"
    - "pivotal"
    - "bria-abc"
    - "dsmb"
    - "data safety monitoring"

aurora:
  name: "오로라월드 (Aurora World Inc) 미국 수입 B/L 건수"
  data_url: "https://www.importinfo.com/aurora-world-inc?monthly_chart"
  page_url: "https://www.importinfo.com/aurora-world-inc"

macro:
  - key: ism_pmi
    name: "미국 ISM 제조업 PMI"
    url: "https://ko.tradingeconomics.com/united-states/business-confidence"
  - key: jp_machine_tool
    name: "일본 공작기계 수주"
    url: "https://ko.tradingeconomics.com/japan/machine-tool-orders"

