name: 데이터 트래커
on:
  schedule:
    - cron: "0 */3 * * *"     # 브리아셀: 3시간마다
    - cron: "0 23 14-16 * *"  # 오로라: 매월 15~17일 08:00 KST
    - cron: "30 0 2-5 * *"    # ISM PMI: 매월 2~5일 09:30 KST
    - cron: "30 7 8-15 * *"   # 일본 공작기계: 매월 8~15일 16:30 KST
    - cron: "0 0 * * 1"       # 구글 트렌드: 매주 월 09:00 KST
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 항목"
        type: choice
        options: [브리아셀, 오로라, ISM, 공작기계, 구글트렌드]
      force:
        description: "이미 보낸 것이어도 지금 다시 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker-${{ github.event.schedule || inputs.job }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 무엇을 실행할지 결정
        id: pick
        env:
          SCHED: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
          FORCE: ${{ inputs.force }}
        run: |
          case "$SCHED$JOB" in
            "0 */3 * * *"|브리아셀)     cmd="briacell.py";;
            "0 23 14-16 * *"|오로라)    cmd="aurora.py";;
            "30 0 2-5 * *"|ISM)         cmd="macro.py --only=ism_pmi";;
            "30 7 8-15 * *"|공작기계)   cmd="macro.py --only=jp_machine_tool";;
            "0 0 * * 1"|구글트렌드)     cmd="trends.py";;
            *) echo "알 수 없는 실행: $SCHED$JOB"; exit 1;;
          esac
          if [ "$FORCE" = "true" ]; then cmd="$cmd --force"; fi
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          case "$cmd" in aurora.py*) echo "browser=false" >> "$GITHUB_OUTPUT";; *) echo "browser=true" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 한글 폰트
        run: sudo apt-get install -y -qq fonts-nanum > /dev/null
      - name: 브라우저 설치
        if: steps.pick.outputs.browser == 'true'
        run: python -m playwright install --with-deps chromium
      - name: 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/${{ steps.pick.outputs.cmd }}
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "state 업데이트"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
